name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: so
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: so
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            ext: dylib
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            ext: dylib
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: dll
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            ext: dll

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build and package plugin
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          MANIFEST_ID="$(sed -n 's/^id: *//p' plugin.yaml | tr -d '\"\r')"
          MANIFEST_VERSION="$(sed -n 's/^  version: *//p' plugin.yaml | tr -d '\"\r')"
          if [[ "${MANIFEST_ID}" != "cliproxyapi-auto-ping" ]]; then
            echo "::error::plugin.yaml id '${MANIFEST_ID}' does not match the cliproxyapi-auto-ping packaging contract"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${TAG_VERSION}" != "${MANIFEST_VERSION}" ]]; then
            echo "::error::release tag '${GITHUB_REF_NAME}' does not match manifest version '${MANIFEST_VERSION}'"
            exit 1
          fi
          if [[ "${GOOS}-${GOARCH}" == "windows-arm64" ]]; then
            export CC=clang
          fi
          mkdir -p package dist
          LIB="cliproxyapi-auto-ping.${EXT}"
          ASSET="cliproxyapi-auto-ping_${MANIFEST_VERSION}_${GOOS}_${GOARCH}.zip"
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared -ldflags "-s -w" -o "package/${LIB}" .
          rm -f package/*.h
          (cd package && python -m zipfile -c "../dist/${ASSET}" "${LIB}")
      - uses: actions/upload-artifact@v4
        with:
          name: cliproxyapi-auto-ping-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.zip | sort -k 2 > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/checksums.txt
